# LoadBearing dogfoods itself: this repository is gated by its own tool.
# See https://github.com/vishweshji/loadbearing for documentation.

version: 1

review:
  required_at: high
  minimum_approvals: 1
  require_fresh_approval: true
  # Advisory-only while the team gets used to this check: posts a PR comment instead of
  # blocking merge. Switch to "block" once the false-positive rate is understood. See
  # docs/configuration.md#reviewmode-block-vs-comment.
  mode: comment

  reviewers:
    users:
      - vishweshji

detectors:
  LB001:
    enabled: true
    severity: medium

  LB002:
    enabled: true
    severity: high

  LB003:
    enabled: true
    severity: high

  LB004:
    enabled: true
    severity: high

  LB005:
    enabled: true
    severity: high
