name: LoadBearing

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  pull_request_review:
    types:
      - submitted
      - dismissed

permissions:
  contents: read
  pull-requests: write # needed for review.mode: comment (see .loadbearing.yml)

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: LoadBearing
        uses: ./
        with:
          github-token: ${{ github.token }}
